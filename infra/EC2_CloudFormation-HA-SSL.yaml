AWSTemplateFormatVersion: '2010-09-09'
Description: 'Core Compute and Database Infrastructure Stack - High Availability Static Multi-AZ Deployment'

Parameters:
  LatestUbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  
  DBName:
    Type: String
    Default: appdb
    Description: Initial database name
  DBUsername:
    Type: String
    Default: admin
    MinLength: 1
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8

  DBPort:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /shared/ports/DBPort
    Description: MySQL port
  HttpPort:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /shared/ports/HttpPort
    Description: HTTP port
  AppPort:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /shared/ports/AppPort
    Description: Application port
# SSL Additional Parameters for HTTPS Listener.  This is from AWS Cert manager.
  SSLCertificateArn:
    Type: String
    Default: arn:aws:acm:eu-west-1:299954288833:certificate/5a32de49-7a11-458c-a726-02bdbd32a18e
    Description: The ARN of the SSL certificate.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  
  AllocatedStorage:
    Type: Number
    Default: 20

  MultiAZ:
    Type: String
    Default: 'true' # Enforced True for High Availability
    AllowedValues:
      - 'true'
      - 'false'

Resources:
  # =========================================================================
  # RELATIONAL DATABASE CLUSTER (MULTI-AZ CO-RESIDENCE)
  # =========================================================================
  MySQLDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      Engine: mysql
      EngineVersion: "8.4.10"
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !Ref MultiAZ
      VPCSecurityGroups:
        - !ImportValue DbSecurityGroupId
      DBSubnetGroupName: !ImportValue RDSSubnetGroup
      Port: !Ref DBPort
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      AutoMinorVersionUpgrade: true
      DeletionProtection: false

  # =========================================================================
  # LOAD BALANCERS AND TARGET GROUPS
  # =========================================================================
  # PUBLIC FRONTEND LOAD BALANCER
  PublicWebALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: public-web-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue PublicWebSubnetId
        - !ImportValue PublicWebSubnetBId
      SecurityGroups:
        - !ImportValue WebSecurityGroupId

  PublicWebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue AssignmentVpcId
      Port: !Ref HttpPort
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /
      HealthCheckPort: !Ref HttpPort
      # Targets property block is completely removed here; the ASG registers instances dynamically

# Updated PublicWebALBListener for SSL changes. 
  PublicWebALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PublicWebALB
      Port: !Ref HttpPort
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301
# New HTTPS Listener for PublicWebALB to handle SSL termination.
  PublicWebHTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PublicWebALB
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref SSLCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PublicWebTargetGroup


  # INTERNAL APPLICATION LAYER LOAD BALANCER (APPIP PROXY BRIDGE)
  InternalAppALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: private-app-alb # FIXED: Changed from internal-app-alb to obey AWS name exclusions
      Scheme: internal
      Type: application
      Subnets:
        - !ImportValue PrivateAppSubnetId
        - !ImportValue PrivateAppSubnetBId
      SecurityGroups:
        - !ImportValue WebSecurityGroupId # Re-uses web SG profile so HTTP forwarders possess visibility

  InternalAppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue AssignmentVpcId
      Port: !Ref AppPort
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /api/users
      HealthCheckPort: !Ref AppPort
      # Targets property block is completely removed here; the ASG registers instances dynamically


  InternalAppALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalAppALB
      Port: !Ref AppPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref InternalAppTargetGroup

  # =========================================================================
  # APPLICATION TIER (LAUNCH TEMPLATE & AUTO SCALING GROUP)
  # =========================================================================
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn: MySQLDatabase
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-AppLaunchTemplate"
      LaunchTemplateData:
        ImageId: !Ref LatestUbuntuAmiId
        InstanceType: t2.micro
        KeyName: 3tierassignment
        NetworkInterfaces:
          - AssociatePublicIpAddress: false
            DeviceIndex: 0
            Groups:
              - !ImportValue AppSecurityGroupId
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: appserver-asg-instance
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e

            cat > /etc/profile.d/app-env.sh <<EOF
            export DBHOST="${MySQLDatabase.Endpoint.Address}"
            export DBUSER="${DBUsername}"
            export DBPASSWORD="${DBPassword}"
            export DBPORT="${DBPort}"
            export DBNAME="${DBName}"
            export APPPORT="${AppPort}"
            EOF

            chmod 644 /etc/profile.d/app-env.sh
            source /etc/profile.d/app-env.sh

            apt-get update -y
            apt-get upgrade -y
            apt-get install -y curl git mariadb-client-core

            # --- Database initialization step removed from UserData ---

            mkdir -p /opt/app
            cd /opt/app
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs

            npm init -y 
            npm install mysql2 cors express
            npm install -g pm2

            cat > server.js <<'EOF'
            const express = require('express');
            const mysql = require('mysql2');
            const cors = require('cors');

            const app = express();
            const APPPORT = process.env.APPPORT;
            app.use(cors());
            app.use(express.json());

            const db = mysql.createConnection({
              host: process.env.DBHOST,
              user: process.env.DBUSER,      
              password: process.env.DBPASSWORD,  
              database: process.env.DBNAME
            });

            db.connect((err) => {
              if (err) {
                 console.error('Database connection failed: ' + err.stack);
                 return;
              }
              console.log('Connected to MySQL database.');
            });

            app.get('/api/users', (req, res) => {
              const sqlQuery = 'SELECT id, name, email FROM users';
              db.query(sqlQuery, (err, results) => {
                if (err) {
                  return res.status(500).json({ error: 'Database query failed' });
                }
                res.json(results);
              });
            });

            app.listen(APPPORT, () => {
              console.log(`Application layer running on http://localhost:${!APPPORT}`);
            });
            EOF

            echo "Web application setup complete... starting PM2." >> message.txt
            pm2 start server.js --name app-tier

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-AppASG"
      VPCZoneIdentifier:
        - !ImportValue PrivateAppSubnetId
        - !ImportValue PrivateAppSubnetBId
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"
      TargetGroupARNs:
        - !Ref InternalAppTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300

  # =========================================================================
  # WEB SERVER TIER (LAUNCH TEMPLATE & AUTO SCALING GROUP)
  # =========================================================================
  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-WebLaunchTemplate"
      LaunchTemplateData:
        ImageId: !Ref LatestUbuntuAmiId
        InstanceType: t2.micro
        KeyName: 3tierassignment
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeviceIndex: 0
            Groups:
              - !ImportValue WebSecurityGroupId
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: webserver-asg-instance
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e

            cat > /etc/profile.d/app-env.sh <<EOF
            export APPPORT="${AppPort}"
            export HTTPPORT="${HttpPort}"
            export APPIP="${InternalAppALB.DNSName}"
            EOF

            chmod 644 /etc/profile.d/app-env.sh
            source /etc/profile.d/app-env.sh
            apt-get update -y
            apt-get upgrade -y
            apt-get install -y curl git 

            mkdir -p /opt/app/public
            cd /opt/app/public

            cat > index.html <<'EOF'
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>3-Tier App Client</title>
              <style>
                body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
                table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
                th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
                th { background-color: #007BFF; color: white; }
              </style>
            </head>
            <body>
            <h1>User Directory</h1>
            <button onclick="fetchUsers()">Load Users</button>
            <table>
            <thead>
              <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
              </tr>
            </thead>
            <tbody id="user-table-body">
              <tr>
                  <td colspan="3">No data loaded yet. Click the button above.</td>
              </tr>
            </tbody>
            </table>
            <script>
            async function fetchUsers() 
            {
              const tableBody = document.getElementById('user-table-body');
              try 
                {
                  const response = await fetch('/local-users');
                  const users = await response.json();
                  tableBody.innerHTML = '';
                  users.forEach(user => 
                   {
                      const row = `<tr>
                          <td>${!user.id}</td>
                          <td>${!user.name}</td>
                          <td>${!user.email}</td>
                      </tr>`;
                      tableBody.innerHTML += row;
                    });
                } 
                  catch (error) 
                 {
                      console.error('Error fetching data:', error);
                      tableBody.innerHTML = `<tr><td colspan="3" style="color: red;">Failed to load data from backend.</td></tr>`;
                 }
            }
            </script>
            </body>
            </html>
            EOF

            cd /opt/app
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
            npm init -y 
            npm install express
            npm install -g pm2

            cat > server.js <<'EOF'
            const express = require('express');
            const path = require('path');
            const app = express();
            const HTTPPORT = process.env.HTTPPORT
            const APPPORT = process.env.APPPORT;
            const APPIP = process.env.APPIP;
            
            app.use(express.static(path.join(__dirname, 'public')));
            
            app.get('/local-users', async (req, res) => {
              try {
                const response = await fetch(`http://${!APPIP}:${!APPPORT}/api/users`);
                const data = await response.json();
                res.json(data);
              } catch (error) {
                console.error('Error fetching users:', error);
                res.status(500).json({ error: 'Failed to fetch users' });
              }
            });            
            app.listen(HTTPPORT, () => {
              console.log(`Listening on port ${!HTTPPORT}`);
            });
            EOF

            echo "Web application setup complete... starting PM2." >> message.txt
            pm2 start server.js --name web-tier

  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-WebASG"
      VPCZoneIdentifier:
        - !ImportValue PublicWebSubnetId
        - !ImportValue PublicWebSubnetBId
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"
      TargetGroupARNs:
        - !Ref PublicWebTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300

# =========================================================================
# UPDATED COMPUTE STACK OUTPUT VALUES
# =========================================================================
Outputs:
  DatabaseEndpoint:
    Description: RDS Endpoint Address
    Value: !GetAtt MySQLDatabase.Endpoint.Address
    
  DatabasePort:
    Description: MySQL Port
    Value: !GetAtt MySQLDatabase.Endpoint.Port
    
  DatabaseName:
    Value: !Ref DBName
    
  PublicALBDNSName:
    Description: Public load balancer entry DNS address
    Value: !GetAtt PublicWebALB.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-PublicALBDNS"
      
  WebServerInstanceId:
    Description: Mapped Auto Scaling Group Identifier replacing the static target alignment constraints.
    Value: !Ref WebAutoScalingGroup
    Export:
      Name: !Sub "${AWS::StackName}-WebServerInstanceId"


