  # =========================================================================
  # WEB SERVER LAYER (STATIC INSTANCES IN AVAILABILITY ZONE 1 & 2)
  # =========================================================================
  # APPIP targets the Private DNS Name of the Internal ALB to balance compute queries safely.
  WebServerAZ1:
    Type: AWS::EC2::Instance
    DependsOn: AppServerAZ1
    Properties:
      ImageId: !Ref LatestUbuntuAmiId
      InstanceType: t2.micro
      KeyName: 3tierassignment
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          GroupSet:
            - !ImportValue WebSecurityGroupId
          SubnetId: !ImportValue PublicWebSubnetId
      Tags:
        - Key: Name
          Value: webserver-az1
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          cat > /etc/profile.d/app-env.sh <<EOF
          export APPPORT="${AppPort}"
          export HTTPPORT="${HttpPort}"
          export APPIP="${InternalAppALB.DNSName}"
          EOF

          chmod 644 /etc/profile.d/app-env.sh
          source /etc/profile.d/app-env.sh
          # Update packages
          apt-get update -y
          apt-get upgrade -y

          # Install curl and git
          apt-get install -y curl git 

          # Create webpage and application directory
          mkdir -p /opt/app/public
          cd /opt/app/public

          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>3-Tier App Client</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
              table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
              th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
              th { background-color: #007BFF; color: white; }
            </style>
          </head>
          <body>
          <h1>User Directory</h1>
          <button onclick="fetchUsers()">Load Users</button>
          <table>
          <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <tr>
                <td colspan="3">No data loaded yet. Click the button above.</td>
            </tr>
          </tbody>
          </table>
          <script>
          async function fetchUsers() 
          {
            const tableBody = document.getElementById('user-table-body');
            try 
              {
                // Call the application layer API
                const response = await fetch('/local-users');
                const users = await response.json();

                // Clear existing table content
                tableBody.innerHTML = '';

                // Dynamically populate the presentation layer
                users.forEach(user => 
                 {
                    const row = `<tr>
                        <td>${!user.id}</td>
                        <td>${!user.name}</td>
                        <td>${!user.email}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                  });
              } 
                catch (error) 
               {
                    console.error('Error fetching data:', error);
                    tableBody.innerHTML = `<tr><td colspan="3" style="color: red;">Failed to load data from backend.</td></tr>`;
               }
          }
          </script>
          </body>
          </html>
          EOF

          # Create application directory
          #mkdir -p /opt/app
          cd /opt/app

          # Install Node.js 22
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

          #init will create package.json
          npm init -y 

          # Install Express
          npm install express
          # Install PM2 globally
          npm install -g pm2

          # Create application  to act as a forwarder service to the app tier.
          cat > server.js <<'EOF'
          const express = require('express');
          const path = require('path');
          const app = express();
          const HTTPPORT = process.env.HTTPPORT
          const APPPORT = process.env.APPPORT;
          const APPIP = process.env.APPIP;
          //const APPPORT = 5000
          // 1. Serve your static HTML file to the browser
          app.use(express.static(path.join(__dirname, 'public')));
          // 2. Create a local endpoint that calls the app layer privately
          // Note the way APPIP is written. The ! mark is not written to the final script.
          app.get('/local-users', async (req, res) => {
            try {
              const response = await fetch(`http://${!APPIP}:${!APPPORT}/api/users`);
              const data = await response.json();
              res.json(data);
            } catch (error) {
              console.error('Error fetching users:', error);
              res.status(500).json({ error: 'Failed to fetch users' });
            }
          });            
          app.listen(HTTPPORT, () => {
            console.log(`Listening on port ${!HTTPPORT}`);
          });
          EOF

          echo "Web application setup complete... starting PM2." >> message.txt
          # Start application using PM2 (a process manager for node.js applications). This needs to run in the application dir.
          # This startup is not working correctly, trying to execute it under ubuntu context is still missing env variables.  
          #sudo -u ubuntu pm2 start server.js --name web-tier --update-env
          #sudo -u ubuntu pm2 save
          #sudo pm2 startup systemd -u ubuntu --hp /home/ubuntu
          #sudo pm2 startup systemd --hp /root
          #env PATH=$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu 
          
          ##### Temporarily run it as root #####
          pm2 start server.js --name web-tier

