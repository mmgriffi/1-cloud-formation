# Cloud Formation template for Assignment 2. Mike Griffin L00213529
Metadata:
  AWSToolsMetrics:
    IaC_Generator: "arn:aws:cloudformation:eu-west-1:299954288833:generatedTemplate/8d229b60-8b5e-48d6-b116-41c28d82ce41"
Parameters:
  SSHLocation:
    Type: String
    Default: 10.10.19.23
    Description: The IP address range that can be used to SSH to the EC2 instances
    # before you run use Powershell command (Invoke-RestMethod -Uri "https://api.ipify.org") to get your public IP address.
  VPCCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: The CIDR block for the VPC.
    AllowedPattern: ^((25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})/(1[6-9]|2[0-8])$
    ConstraintDescription: Enter a valid CIDR block such as 10.0.0.0/16.
    # This parameter is used to specify the CIDR block for the VPC.
  DatabasePort:
    Type: Number
    Default: 3306
    Description: MySQL port
  HTTPPort:
    Type: Number
    Default: 8080
    Description: HTTP port
  AppPort:
    Type: Number
    Default: 5000
    Description: Application port
Resources:
 AssignmentVPC:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::VPC"
  DeletionPolicy: "Delete"
  Properties:
   CidrBlock: !Ref VPCCidr
   EnableDnsSupport: true
   EnableDnsHostnames: true
   Tags:
   - Value: "AssignmentVPC"
     Key: "Name"
 InternetGateway:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::InternetGateway"
  DeletionPolicy: "Delete"
  Properties:
   Tags:
   - Value: "InternetGateway"
     Key: "Name"
 AssignmentVPCGatewayAttachment:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::VPCGatewayAttachment"
  DeletionPolicy: "Delete"
  Properties:
   InternetGatewayId: !Ref InternetGateway
   VpcId: !Ref AssignmentVPC
 PublicWebSubnet:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::Subnet"
  DeletionPolicy: "Delete"
  Properties:
   MapPublicIpOnLaunch: true
   VpcId: !Ref AssignmentVPC
   AvailabilityZone: !Select [0, !GetAZs '']
   #removed hardcoded region and replaced with !GetAZs '' to get the first AZ in the region where the stack is deployed
   CidrBlock: !Select
   - 0
   - !Cidr [!Ref VPCCidr, 4, 8]
   Tags:
   - Value: "PublicWebSubnet"
     Key: "Name"
 PrivateAppSubnet:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::Subnet"
  DeletionPolicy: "Delete"
  Properties:
   VpcId: !Ref AssignmentVPC
   AvailabilityZone: !Select [0, !GetAZs '']
   CidrBlock: !Select
   - 1
   - !Cidr [!Ref VPCCidr, 4, 8]
   Tags:
   - Value: "PrivateAppSubnet"
     Key: "Name"
 PrivateDbSubnetA:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::Subnet"
  DeletionPolicy: "Delete"
  Properties:
   VpcId: !Ref AssignmentVPC
   AvailabilityZone: !Select [0, !GetAZs '']
   CidrBlock: !Select
   - 2
   - !Cidr [!Ref VPCCidr, 4, 8]
   Tags:
   - Value: "PrivateDbSubnetA"
     Key: "Name"
 PrivateDbSubnetB:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::Subnet"
  DeletionPolicy: "Delete"
  Properties:
   VpcId: !Ref AssignmentVPC
   AvailabilityZone: !Select [1, !GetAZs '']
   # removed hardcoded region and replaced with !GetAZs '' to get the second AZ as required by RDS SQL database. 
   CidrBlock: !Select
   - 3
   - !Cidr [!Ref VPCCidr, 4, 8]
   Tags:
   - Value: "PrivateDbSubnetB"
     Key: "Name"
 PublicRouteTable:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::RouteTable"
  DeletionPolicy: "Delete"
  Properties:
   VpcId: !Ref AssignmentVPC
   Tags:
   - Value: "PublicRouteTable"
     Key: "Name"        
 PrivateRouteTable:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::RouteTable"
  DeletionPolicy: "Delete"
  Properties:
   VpcId: !Ref AssignmentVPC
   Tags:
   - Value: "PrivateRouteTable"
     Key: "Name"
 PublicRouteEntry1:
  DependsOn:
  - AssignmentVPCGatewayAttachment
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::Route"
  DeletionPolicy: "Delete"
  Properties:
   GatewayId: !Ref InternetGateway
   RouteTableId: !Ref PublicRouteTable
   DestinationCidrBlock: "0.0.0.0/0"
 PrivateRouteEntry1:                    #this needs to be open for the app server to access the internet for updates and package downloads
  DependsOn:
  - AssignmentVPCGatewayAttachment
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::Route"
  DeletionPolicy: "Delete"
  Properties:
   GatewayId: !Ref InternetGateway
   RouteTableId: !Ref PrivateRouteTable
   DestinationCidrBlock: "0.0.0.0/0"
 PublicSubnetAssociation:
  Type: AWS::EC2::SubnetRouteTableAssociation
  Properties:
   SubnetId: !Ref PublicWebSubnet
   RouteTableId: !Ref PublicRouteTable
 AppSubnetAssociation:
  Type: AWS::EC2::SubnetRouteTableAssociation
  Properties:
   SubnetId: !Ref PrivateAppSubnet
   RouteTableId: !Ref PrivateRouteTable
 DbSubnetAAssociation:
  Type: AWS::EC2::SubnetRouteTableAssociation
  Properties:
   SubnetId: !Ref PrivateDbSubnetA
   RouteTableId: !Ref PrivateRouteTable
 DbSubnetBAssociation:
  Type: AWS::EC2::SubnetRouteTableAssociation
  Properties:
   SubnetId: !Ref PrivateDbSubnetB
   RouteTableId: !Ref PrivateRouteTable 
 WebSecurityGroup:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::SecurityGroup"
  DeletionPolicy: "Delete"
  Properties:
   GroupDescription: "Allows HTTP/HTTPS traffic from the internet to the web server."
   GroupName: "web-sg-assignment1"
   Tags:
   - Key: Name
     Value: WebSecurityGroup
   VpcId: !Ref AssignmentVPC
   SecurityGroupIngress:
   - CidrIp: "0.0.0.0/0"
     IpProtocol: "tcp"
     FromPort: !Ref HTTPPort
     ToPort: !Ref HTTPPort
   - CidrIp: "0.0.0.0/0"
     IpProtocol: "tcp"
     FromPort: 443
     ToPort: 443
   - CidrIp: !Ref SSHLocation  #temporary for SSH access, remove in production
     IpProtocol: "tcp"
     FromPort: 22
     ToPort: 22
 AppSecurityGroup:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::SecurityGroup"
  DeletionPolicy: "Delete"
  Properties:
   GroupDescription: "Allows traffic only from the web server on the application\
      \ port (e.g. 5000)."
   GroupName: "app-sg-assignment1"
   Tags:
   - Key: Name
     Value: AppSecurityGroup
   VpcId: !Ref AssignmentVPC
   SecurityGroupIngress:
   - IpProtocol: "tcp"
     FromPort: !Ref AppPort
     SourceSecurityGroupId: !Ref WebSecurityGroup
     ToPort: !Ref AppPort
   - IpProtocol: "tcp"    #allow SSH access from the web server for management, remove in production
     FromPort: 22
     SourceSecurityGroupId: !Ref WebSecurityGroup
     ToPort: 22
 DbSecurityGroup:
  UpdateReplacePolicy: "Delete"
  Type: "AWS::EC2::SecurityGroup"
  DeletionPolicy: "Delete"
  Properties:
   GroupDescription: "Allows database traffic only from the application server."
   GroupName: "db-sg-assignment1"
   Tags:
   - Key: Name
     Value: DbSecurityGroup
   VpcId: !Ref AssignmentVPC
   SecurityGroupIngress:
   - IpProtocol: "tcp"
     FromPort: !Ref DatabasePort
     SourceSecurityGroupId: !Ref AppSecurityGroup
     ToPort: !Ref DatabasePort
   SecurityGroupEgress:
   - CidrIp: "0.0.0.0/0"
     IpProtocol: "-1"
 RDSSubnetGroup:
  Type: AWS::RDS::DBSubnetGroup
  Properties:
    DBSubnetGroupDescription: DB Subnet Group for RDS
    SubnetIds:
      - !Ref PrivateDbSubnetA
      - !Ref PrivateDbSubnetB
    Tags:
      - Key: Name
        Value: DBSubnetGroup
Outputs:
 RDSSubnetGroupName:
   Value: !Ref RDSSubnetGroup
   Export:
     Name: RDSSubnetGroup
 PrivateAppSubnetId:
   Value: !Ref PrivateAppSubnet
   Export:
     Name: PrivateAppSubnetId
 PublicWebSubnetId:
   Value: !Ref PublicWebSubnet
   Export:
    Name: PublicWebSubnetId
 PrivateDbSubnetAId:
   Value: !Ref PrivateDbSubnetA
   Export:
    Name: PrivateDbSubnetAId
 PrivateDbSubnetBId:
   Value: !Ref PrivateDbSubnetB
   Export:
    Name: PrivateDbSubnetBId
 DbSecurityGroupId:
   Value: !Ref DbSecurityGroup
   Export:
    Name: DbSecurityGroupId
 WebSecurityGroupId:
   Value: !Ref WebSecurityGroup
   Export:
    Name: WebSecurityGroupId
 AppSecurityGroupId:
   Value: !Ref AppSecurityGroup
   Export:
    Name: AppSecurityGroupId      
 VpcId:
   Value: !Ref AssignmentVPC
   Export:
    Name: AssignmentVpcId
 DbPort:
   Value: !Ref DatabasePort
   Export:
    Name: NetworkStack-DatabasePort
 HTTPPort:
   Value: !Ref HTTPPort
   Export:
    Name: NetworkStack-HTTPPort
 AppPort:
   Value: !Ref AppPort
   Export:
    Name: NetworkStack-AppPort