AWSTemplateFormatVersion: '2010-09-09'
Description: Edge Layer Routing Stack - Exposes high availability load balancer endpoints and validates core mapping addresses.

Parameters:
  EC2StackName:
    Type: String
    Default: CF-EC2Stack-Assignment-HA  # Make sure this matches the exact name you used to launch your Core Compute stack
    Description: Name of the core compute stack exporting web architecture parameters.
  HttpPort:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /shared/ports/HttpPort
    Description: Frontend HTTP execution port.
  DNSName:
    Type: String
    Default: cluen1.mynetgear.com
    Description: No-IP generated DNS host associated with your high availability web layer application.

Resources:
  # =========================================================================
  # ORCHESTRATION COMPLIANCE RESOURCE
  # =========================================================================
  # Replaces the deleted WebServerEIP to ensure valid template syntax.
  # Stores the routing record pointer configuration safely inside the SSM Parameter store.
  RoutingStackDeploymentAnchor:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/routing/${AWS::StackName}/dns-target"
      Type: String
      Value: !Ref DNSName
      Description: Tracking anchor to satisfy CloudFormation compilation rules for routing pointer distributions.

Outputs:
  HighAvailabilityLoadBalancerDNS:
    Description: The target Canonical Name (CNAME) record address you must point your No-IP domain (mynetgear.com) to.
    Value:
      Fn::ImportValue:
        !Sub "${EC2StackName}-PublicALBDNS"

  WebAppIPURL:
    Description: High Availability application access URL directly addressing the public application load balancing mesh.
    Value: !Sub
      - "https://${ALBDNS}"
      - ALBDNS:
          Fn::ImportValue:
            !Sub "${EC2StackName}-PublicALBDNS"

  AssociatedInstanceId:
    Description: The parent Auto Scaling Group identifier orchestrating the underlying compute fleet.
    Value:
      Fn::ImportValue:
        !Sub "${EC2StackName}-WebServerInstanceId"

  WebAppURL:
    Description: Public application execution URL mapped via your external domain broker entry.
    Value: !Sub
      - "https://${FQDNName}"
      - FQDNName: !Ref DNSName
