name: Deploy CloudFormation and Sync to S3

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy AWS CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: my-cloudformation-stack
          template: ./infra/CFtemplate-Assignment1-template.yaml
          no-fail-on-empty-changeset: "1"

      - name: Sync Files to S3
        run: |
          #aws s3 sync ./src s3://atu-l00213529-cloudformation/ --delete
          aws s3 sync ./src s3://atu-l00213529-cloudformation/
